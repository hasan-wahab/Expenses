environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_screenutil: ^5.9.3
  intl: ^0.20.2
  firebase_auth: ^6.5.3
  firebase_core: ^4.11.0
  cloud_firestore: ^6.6.0
  sqflite: ^2.4.3
  flutter_bloc: ^9.1.1
  bloc: ^9.2.1
  get_it: ^9.2.1
  image_picker: ^1.2.2
  connectivity_plus: ^7.1.1
  go_router: ^17.3.0
  dropdown_button2: ^3.1.0
